<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÉDITO — Administration</title>
<style>
  :root{
    --ink:#1E3A5F;--ink-l:#3D5D85;--ink-p:#E7ECF2;--ink-d:#12263F;
    --bg:#F4F6F9;--card:#FFFFFF;--text:#1A2433;--gray:#6B7A90;--line:#E1E7EF;
    --danger:#C0392B;--ok:#1E7A46;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .topbar{background:linear-gradient(135deg,var(--ink) 0%,var(--ink-d) 100%);color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;}
  .topbar h1{font-size:18px;font-weight:700;letter-spacing:.5px;}
  .topbar span{font-size:12px;opacity:.8;}
  .topbar button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;}
  .wrap{max-width:900px;margin:0 auto;padding:20px;}
  .row{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px;}
  .row h2{font-size:16px;color:var(--ink-d);}
  .btn{background:var(--ink);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn:active{opacity:.85;}
  .btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;}
  .btn-outline{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
  .tenant-h{display:flex;justify-content:space-between;align-items:center;}
  .tenant-h b{font-size:15px;}
  .tenant-h .meta{font-size:12px;color:var(--gray);margin-top:2px;}
  .team{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;}
  .member{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;}
  .member .nm{font-weight:600;}
  .member .em{color:var(--gray);font-size:12px;}
  .badge{display:inline-block;background:var(--ink-p);color:var(--ink-d);font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;margin-top:4px;}
  .empty{color:var(--gray);font-size:13px;text-align:center;padding:30px 0;}
  /* Modal */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(18,38,63,.5);z-index:50;align-items:flex-end;justify-content:center;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:22px;max-height:88vh;overflow-y:auto;}
  .modal h3{font-size:16px;margin-bottom:14px;color:var(--ink-d);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--gray);margin-bottom:5px;font-weight:600;}
  .field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fafbfc;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--ink);}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions button{flex:1;padding:12px;border-radius:8px;font-size:14px;font-weight:600;border:none;cursor:pointer;}
  .cancel{background:var(--bg);color:var(--text);}
  .submit{background:var(--ink);color:#fff;}
  /* Login */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:#fff;border-radius:16px;padding:32px 26px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(18,38,63,.12);}
  .login-card h1{color:var(--ink-d);font-size:20px;margin-bottom:4px;}
  .login-card p{color:var(--gray);font-size:13px;margin-bottom:20px;}
  .login-card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;font-size:14px;}
  .login-card button{width:100%;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;margin-top:4px;}
  .err{color:var(--danger);font-size:13px;margin-top:8px;display:none;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink-d);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:100;display:none;max-width:90%;text-align:center;}
</style>
</head>
<body>

<div id="loginWrap" class="login-wrap">
  <div class="login-card">
    <h1>ÉDITO</h1>
    <p>Panneau d'administration — accès réservé</p>
    <input type="email" id="li-email" placeholder="Adresse email">
    <input type="password" id="li-pass" placeholder="Mot de passe">
    <button onclick="doLogin()">Se connecter</button>
    <div class="err" id="li-err"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="topbar">
    <div>
      <h1>ÉDITO · Administration</h1>
      <span id="whoami"></span>
    </div>
    <button onclick="doLogout()">Déconnexion</button>
  </div>
  <div class="wrap">
    <div class="row">
      <h2>Maisons d'édition</h2>
      <button class="btn" onclick="openTenantModal()">+ Ajouter une maison d'édition</button>
    </div>
    <div id="tenantList"></div>
  </div>
</div>

<!-- Modal: Ajouter une maison d'édition -->
<div class="modal-bg" id="modalTenant">
  <div class="modal">
    <h3>Nouvelle maison d'édition</h3>
    <div class="field"><label>Nom de la maison d'édition *</label><input id="t-name" placeholder="Ex : Éditions Lumière"></div>
    <div class="field"><label>Téléphone *</label><input id="t-tel1" placeholder="Ex : 01 97 40 52 35"></div>
    <div class="field"><label>Téléphone secondaire (optionnel)</label><input id="t-tel2"></div>
    <div class="field"><label>Email de contact *</label><input id="t-email" type="email" placeholder="contact@..."></div>
    <div class="field"><label>RCCM (optionnel)</label><input id="t-rccm"></div>
    <div class="field"><label>Adresse (optionnel)</label><input id="t-addr"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeModal('modalTenant')">Annuler</button>
      <button class="submit" onclick="submitTenant()">Créer</button>
    </div>
  </div>
</div>

<!-- Modal: Ajouter un collaborateur -->
<div class="modal-bg" id="modalMember">
  <div class="modal">
    <h3>Ajouter un collaborateur</h3>
    <p style="font-size:12px;color:var(--gray);margin-bottom:14px;" id="m-tenant-label"></p>
    <div class="field"><label>Nom complet *</label><input id="m-name" placeholder="Ex : Marie Kouassi"></div>
    <div class="field"><label>Email *</label><input id="m-email" type="email" placeholder="email@exemple.com"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeModal('modalMember')">Annuler</button>
      <button class="submit" onclick="submitMember()">Ajouter</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getDatabase,ref,set,get,onValue,push}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const FC={apiKey:"AIzaSyAYPp-_BDKvsSQrQ0mXxz5LjePcxzzgMAI",authDomain:"edito-saas-7d63f.firebaseapp.com",databaseURL:"https://edito-saas-7d63f-default-rtdb.firebaseio.com",projectId:"edito-saas-7d63f",storageBucket:"edito-saas-7d63f.firebasestorage.app",messagingSenderId:"536797653751",appId:"1:536797653751:web:c6c688905fb179450901f2"};

// Liste des emails autorisés à administrer Édito.
const SUPERADMINS=['rhemaeditions@gmail.com'];

const app=initializeApp(FC);
const auth=getAuth(app);
const db=getDatabase(app);

// Second instance Firebase, utilisée uniquement pour créer des comptes collaborateurs
// sans déconnecter la session de l'administrateur.
const secondaryApp=initializeApp(FC,'secondary');
const secondaryAuth=getAuth(secondaryApp);

let CURRENT_USER=null;

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>t.style.display='none',3500);
}
function openModal(id){document.getElementById(id).classList.add('show');}
window.closeModal=function(id){document.getElementById(id).classList.remove('show');};

window.doLogin=async function(){
  const email=document.getElementById('li-email').value.trim();
  const pass=document.getElementById('li-pass').value;
  const errEl=document.getElementById('li-err');
  errEl.style.display='none';
  if(!email||!pass){errEl.textContent='Remplis email et mot de passe.';errEl.style.display='block';return;}
  try{
    await signInWithEmailAndPassword(auth,email,pass);
  }catch(e){
    errEl.textContent='Connexion refusée : email ou mot de passe incorrect.';
    errEl.style.display='block';
  }
};
window.doLogout=function(){signOut(auth);};

onAuthStateChanged(auth,user=>{
  if(user && SUPERADMINS.includes(user.email)){
    CURRENT_USER=user;
    document.getElementById('loginWrap').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('whoami').textContent=user.email;
    loadTenants();
  } else if(user){
    // connecté mais pas autorisé
    document.getElementById('li-err').textContent="Ce compte n'a pas accès à l'administration d'Édito.";
    document.getElementById('li-err').style.display='block';
    signOut(auth);
  } else {
    document.getElementById('loginWrap').style.display='flex';
    document.getElementById('app').style.display='none';
  }
});

function slugify(s){
  return s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

let TENANTS_CACHE={};

function loadTenants(){
  onValue(ref(db,'tenants'),snap=>{
    TENANTS_CACHE=snap.val()||{};
    renderTenants();
  });
}

function renderTenants(){
  const list=document.getElementById('tenantList');
  const ids=Object.keys(TENANTS_CACHE);
  if(ids.length===0){
    list.innerHTML='<div class="empty">Aucune maison d\'édition pour l\'instant.<br>Clique sur "+ Ajouter une maison d\'édition" pour commencer.</div>';
    return;
  }
  list.innerHTML=ids.map(id=>{
    const t=TENANTS_CACHE[id];
    const settings=t.settings||{};
    const team=t.team||{};
    const members=Object.entries(team);
    return `
    <div class="card">
      <div class="tenant-h">
        <div>
          <b>${settings.name||id}</b>
          <div class="meta">${settings.email||''}${settings.tel1?' · '+settings.tel1:''}</div>
          <span class="badge">${members.length} collaborateur${members.length>1?'s':''}</span>
        </div>
        <button class="btn btn-sm btn-outline" onclick="openMemberModal('${id}','${(settings.name||id).replace(/'/g,"\\'")}')">+ Collaborateur</button>
      </div>
      <div class="team">
        ${members.length===0?'<div class="empty" style="padding:10px 0;">Aucun collaborateur ajouté</div>':
          members.map(([uid,m])=>`
            <div class="member">
              <div><div class="nm">${m.name||''}</div><div class="em">${m.email||''}</div></div>
            </div>
          `).join('')}
      </div>
    </div>`;
  }).join('');
}

window.openTenantModal=function(){
  ['t-name','t-tel1','t-tel2','t-email','t-rccm','t-addr'].forEach(id=>document.getElementById(id).value='');
  openModal('modalTenant');
};

window.submitTenant=async function(){
  const name=document.getElementById('t-name').value.trim();
  const tel1=document.getElementById('t-tel1').value.trim();
  const email=document.getElementById('t-email').value.trim();
  const tel2=document.getElementById('t-tel2').value.trim();
  const rccm=document.getElementById('t-rccm').value.trim();
  const addr=document.getElementById('t-addr').value.trim();
  if(!name||!tel1||!email){toast('Nom, téléphone et email sont obligatoires.');return;}
  const base=slugify(name);
  const tenantId=base+'-'+Math.random().toString(36).slice(2,6);
  try{
    await set(ref(db,'tenants/'+tenantId+'/settings'),{
      name,tel1,tel2,email,rccm,addr,createdAt:Date.now(),createdBy:CURRENT_USER.email
    });
    closeModal('modalTenant');
    toast('Maison d\'édition créée : '+name);
  }catch(e){
    toast('Erreur : '+e.message);
  }
};

let PENDING_TENANT=null;
window.openMemberModal=function(tenantId,tenantName){
  PENDING_TENANT=tenantId;
  document.getElementById('m-tenant-label').textContent='Pour : '+tenantName;
  document.getElementById('m-name').value='';
  document.getElementById('m-email').value='';
  openModal('modalMember');
};

window.submitMember=async function(){
  const name=document.getElementById('m-name').value.trim();
  const email=document.getElementById('m-email').value.trim();
  if(!name||!email){toast('Nom et email sont obligatoires.');return;}
  if(!PENDING_TENANT){toast('Erreur interne : maison d\'édition non identifiée.');return;}
  try{
    // Mot de passe temporaire aléatoire — le collaborateur le remplacera via l'email reçu
    const tempPass='Tmp-'+Math.random().toString(36).slice(2,10)+'!9';
    const cred=await createUserWithEmailAndPassword(secondaryAuth,email,tempPass);
    const uid=cred.user.uid;
    await set(ref(db,'tenants/'+PENDING_TENANT+'/team/'+uid),{name,email,addedAt:Date.now()});
    await set(ref(db,'userTenants/'+uid),{tenantId:PENDING_TENANT,name});
    await sendPasswordResetEmail(auth,email);
    await signOut(secondaryAuth);
    closeModal('modalMember');
    toast('Collaborateur ajouté — email de création de mot de passe envoyé à '+email);
  }catch(e){
    let msg=e.message;
    if(e.code==='auth/email-already-in-use')msg="Cet email est déjà utilisé par un autre compte Édito.";
    toast('Erreur : '+msg);
  }
};
</script>
</body>
</html>
